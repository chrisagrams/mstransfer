name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/mstransfer/**'
      - '.github/workflows/docs.yml'
  # Validate the site builds on every PR into dev (build only, no deploy).
  # Not path-filtered so docs: PRs, which skip build.yml, always get a check.
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment, cancelling in-progress runs.
# PR builds are grouped per-PR so they never cancel a Pages deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Build site
        run: uv run --only-group docs zensical build --strict

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
